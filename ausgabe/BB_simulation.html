<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bardot Spraybild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--petrol:#0c5664;--petrol-tief:#094450;--papier:#f6f1e8;--gelb:#f5cb26;--rosa:#eb6e7a;--schwarz:#16181c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--petrol);color:var(--papier);font:400 17px/1.45 Barlow,system-ui,sans-serif;
  display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;height:100dvh;padding:24px 32px 24px 24px;overflow:hidden}
#buehne{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
canvas#stage{display:block;max-width:100%;max-height:100%;aspect-ratio:840/1020;height:100%;background:var(--papier)}
canvas#stage.spruehen{cursor:crosshair;touch-action:none}
aside{display:flex;flex-direction:column;min-height:0}
h1{font:400 44px/1.02 "Saira Stencil One",Barlow,sans-serif;margin:0 0 4px;color:var(--gelb)}
.unter{margin:0 0 16px;font-size:16px}
ol{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;
  width:100%;padding:5px 6px;font-weight:500}
li button:hover{background:var(--petrol-tief)}
li.an button{color:var(--gelb);font-weight:600}
li button:focus-visible,.knopf:focus-visible,input:focus-visible{outline:2px solid var(--gelb);outline-offset:1px}
.platte{position:relative;width:30px;height:19px;background:var(--c,transparent);display:flex;gap:2px;justify-content:center;
  border:1px solid rgba(246,241,232,.55)}
.platte i{width:3px;height:4px;background:var(--n)}
.nr{font-variant-numeric:tabular-nums;text-align:center}
li p{margin:2px 6px 10px 46px;font-size:16px;display:none;max-width:60ch}
li.an p{display:block}
.werte{margin:8px 6px 0;min-height:26px;font-size:16px}
.werte input{width:100%;accent-color:var(--gelb)}
.werte label{display:block}
.leiste{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.knopf{font:600 16px Barlow,sans-serif;border:0;padding:9px 16px;cursor:pointer;background:var(--papier);color:var(--schwarz)}
.knopf.haupt{background:var(--gelb)}
.knopf[disabled]{opacity:.45;cursor:default}
.wahl{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.wahl input{accent-color:var(--gelb);width:17px;height:17px}
.quelle{font-size:14px;margin:12px 0 0;opacity:.85}
@media (max-width:900px){
  body{display:block;height:auto;overflow:auto;padding:16px}
  #buehne{display:block}
  canvas#stage{width:100%;height:auto}
  aside{margin-top:18px}
  h1{font-size:36px}
  ol{overflow:visible}
}
</style>
</head>
<body>
<main id="buehne"><canvas id="stage" width="840" height="1020" role="img" aria-label="Werkbank von oben mit Foto, Schablone und Spraybild"></canvas></main>
<aside>
  <h1>Brigitte Bardot</h1>
  <p class="unter">Vom Foto zum Vierfarb-Spraybild, 360 × 450 mm</p>
  <ol id="schritte"></ol>
  <div class="werte" id="werte" aria-live="polite"></div>
  <div class="leiste">
    <button class="knopf haupt" id="play">Pause</button>
    <button class="knopf" id="neu">Neu starten</button>
    <label class="wahl"><input type="checkbox" id="selbst"> Selbst sprühen</label>
  </div>
  <p class="quelle">Vorlage: Werbefoto „Brigitte Bardot - 1962“, Wikimedia Commons, als gemeinfrei gekennzeichnet (Quelle: MGM). Masken und Schnittkonturen stammen aus dem Schablonensatz.</p>
</aside>

    const f=ease(clamp((t-start-k*each)/each));if(!f)return;
    if(!before&&f>0){X.save();X.globalAlpha=f;X.drawImage(paper,0,0);X.restore();before=true}
    X.save();X.beginPath();X.rect(0,0,W,MY+MH*f);X.clip();X.drawImage(solid[k],0,0);X.restore();
    if(f<1){X.fillStyle=css(l);X.fillRect(MX,MY+MH*f-2,MW,4)}
  });
}};
S.stege={dur:10.5,enter(){
  const c=mk(),x=c.getContext('2d');x.drawImage(blankPlate(1),0,0);
  x.globalCompositeOperation='destination-out';x.drawImage(raw2,MX,MY);
  this.rahmen=mk();const y=this.rahmen.getContext('2d');y.drawImage(c,0,0);
  y.globalCompositeOperation='destination-out';y.drawImage(isl2,MX,MY);
  this.insel=maskFilled(isl2,'rgb(235,110,122)');
  const b=maskFilled(br2,'rgb(12,86,100)');this.steg=mk();
  const z=this.steg.getContext('2d');for(const [a,d] of [[0,0],[2,0],[-2,0],[0,2],[0,-2]])z.drawImage(b,a,d);
},draw(){
  X.drawImage(paper,0,0);X.drawImage(this.rahmen,0,0);
  if(t<4){const d=ease(clamp((t-1.8)/1.8));X.globalAlpha=1-d;X.drawImage(this.insel,0,d*320);X.globalAlpha=1}
  else{
    X.globalAlpha=ease(clamp((t-4)/.6));X.drawImage(this.insel,0,0);X.globalAlpha=1;
    const f=ease(clamp((t-5)/3));X.save();X.beginPath();X.rect(0,0,W,MY+MH*f);X.clip();X.drawImage(this.steg,0,0);X.restore();
  }
}};
S.laser={dur:18,enter(){this.k=-1;this.next()},next(){
  this.k++;this.done=this.k>3;this.hold=0;if(this.done)return;
  this.p=mk();const x=this.px=this.p.getContext('2d');x.drawImage(blankPlate(this.k),0,0);
  this.r=rings[this.k];this.len=0;for(const r of this.r)for(let i=2;i<r.length;i+=2)this.len+=Math.hypot(r[i]-r[i-2],r[i+1]-r[i-1]);
  this.s=0;this.ri=0;this.pi=0;this.pos=[0,0];
},tick(dt){
  if(this.done){this.hold+=dt;return this.hold>2.6}
  if(this.ri>=this.r.length){this.hold+=dt;if(this.hold>.5){plates[this.k]=this.p;this.next()}return false}
  let rest=this.len/3.4*dt;const x=this.px;
  x.strokeStyle='rgba(22,24,28,.8)';x.lineWidth=1.5;
  while(rest>1e-6&&this.ri<this.r.length){
    const r=this.r[this.ri];
    if(this.pi===0){this.pos=[r[0],r[1]];this.pi=2}
    if(this.pi>=r.length){x.save();x.globalCompositeOperation='destination-out';x.fill(ringPath(r));x.restore();
      x.stroke(ringPath(r));this.ri++;this.pi=0;continue}
    const a=this.pos,dx=r[this.pi]-a[0],dy=r[this.pi+1]-a[1],d=Math.hypot(dx,dy),q=d?Math.min(1,rest/d):1,b=[a[0]+dx*q,a[1]+dy*q];
    x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();
    this.pos=b;if(q<1)break;rest-=d;this.pi+=2;
  }
  return false;
},draw(){
  X.fillStyle=getComputedStyle(document.body).backgroundColor;X.fillRect(0,0,W,H);
  if(this.done){
    const s=.47,g=(W-2*W*s)/3;
    plates.forEach((p,i)=>{const a=g+(i%2)*(W*s+g),b=(H-2*H*s)/3+(i>>1)*(H*s+(H-2*H*s)/3);X.drawImage(paper,a,b,W*s,H*s);X.drawImage(p,a,b,W*s,H*s)});
    return;
  }
  X.drawImage(paper,0,0);X.drawImage(this.p,0,0);
  if(this.ri<this.r.length){const [a,b]=this.pos,g=X.createRadialGradient(a,b,1,a,b,22);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(245,203,38,.9)');g.addColorStop(1,'rgba(245,203,38,0)');
    X.fillStyle=g;X.beginPath();X.arc(a,b,22,0,7);X.fill()}
  X.fillStyle=css(LAYERS[this.k]);X.font='600 26px Barlow,sans-serif';X.textAlign='left';X.fillText(`${LAYERS[this.k].id} ${LAYERS[this.k].name}`,14,H-14);
}};
S.spray={enter(k){
  this.k=k;this.phase='auflegen';this.pt=0;
  sprayed[k]=null;rebuild(k);
  sprite=makeSprites(k);
  this.paint=mk();this.pc=this.paint.getContext('2d');
  this.plate=mk();this.tc=this.plate.getContext('2d');this.tc.drawImage(plates[k],0,0);
  this.live=mk();this.lc=this.live.getContext('2d');
  this.path=0;this.can=null;this.cover=0;this.last=0;
  // Stichprobe der Öffnung für die Deckung
  const m=mk(210,255),x=m.getContext('2d',{willReadFrequently:true});x.drawImage(masks[k],MX/4,MY/4,MW/4,MH/4);
  const a=x.getImageData(0,0,210,255).data;this.samples=[];for(let i=0;i<a.length/4;i++)if(a[i*4+3]>128)this.samples.push(i);
},stamp(a,b){
  const s=sprite[Math.random()*4|0],q=70;
  this.pc.drawImage(s,a-q,b-q);
  this.tc.save();this.tc.globalCompositeOperation='source-atop';this.tc.drawImage(s,a-q,b-q);this.tc.restore();
},line(p,q){
  const d=Math.hypot(q[0]-p[0],q[1]-p[1]),n=Math.max(1,d/14|0);
  for(let i=1;i<=n;i++)this.stamp(p[0]+(q[0]-p[0])*i/n,p[1]+(q[1]-p[1])*i/n);
},auto(u){ // Zickzack über die Platte, u = zurückgelegte Zeilen
  const row=44,rows=Math.ceil(H/row)+1,i=Math.min(rows-1,u|0),f=u-i,l=-40,r=W+40;
  return [i%2?r+(l-r)*f:l+(r-l)*f,row/2+i*row];
},measure(){
  const c=mk(210,255),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(this.paint,0,0,210,255);
  const a=x.getImageData(0,0,210,255).data;let n=0;for(const i of this.samples)if(a[i*4+3]>200)n++;
  this.cover=this.samples.length?Math.round(100*n/this.samples.length):0;
},finish(){
  sprayed[this.k]=this.paint;rebuild(this.k+1);
  this.phase='trocknen';this.pt=0;this.can=null;showValues();
},tick(dt){
  this.pt+=dt;
  if(this.phase==='auflegen'&&this.pt>1.1){this.phase='sprühen';this.pt=0;showValues()}
  else if(this.phase==='sprühen'&&!self){
    const prev=this.can||this.auto(this.path),rows=Math.ceil(H/44)+1;
    this.path+=dt*rows/3.8;this.can=this.auto(this.path);this.line(prev,this.can);
    if(this.path>=rows){
      for(const x of [this.pc,this.tc]){x.save();if(x===this.tc)x.globalCompositeOperation='source-atop';x.globalAlpha=.75;x.fillStyle=css(LAYERS[this.k]);x.fillRect(0,0,W,H);x.restore()}
      this.finish();
    }
  }else if(this.phase==='sprühen'&&this.pt-this.last>.25){this.last=this.pt;this.measure();showValues()}
  else if(this.phase==='trocknen'&&this.pt>1.5){this.phase='abheben';this.pt=0;showValues()}
  else if(this.phase==='abheben'&&this.pt>1.1){this.phase='fertig';this.pt=0;return true}
  return this.phase==='fertig'&&this.pt>.3;
},draw(){
  X.drawImage(print,0,0);
  if(this.phase==='fertig')return;
  let y=0;
  if(this.phase==='auflegen')y=-(1-ease(clamp(this.pt/1)))*H;
  if(this.phase==='abheben')y=-ease(clamp(this.pt/1))*H;
  if(this.phase==='sprühen'){
    this.lc.clearRect(0,0,W,H);this.lc.globalCompositeOperation='source-over';this.lc.drawImage(this.paint,0,0);
    this.lc.globalCompositeOperation='destination-in';this.lc.drawImage(masks[this.k],MX,MY);X.drawImage(this.live,0,0);
  }
  for(const [a,b] of PINS){X.fillStyle='#8b8f92';X.beginPath();X.arc(a*2,b*2,6,0,7);X.fill()}
  X.drawImage(this.plate,0,y);
  if(this.can){const [a,b]=this.can;
    X.strokeStyle='rgba(246,241,232,.9)';X.lineWidth=2;X.beginPath();X.arc(a,b,62,0,7);X.stroke();
    X.fillStyle=css(LAYERS[this.k]);X.beginPath();X.arc(a,b,13,0,7);X.fill();X.stroke()}
}};
S.ende={dur:1,draw(){
  X.drawImage(print,0,0);
  const v=+($('vergleich')?.value??100);
  if(v<100){const c=MX+MW*v/100;X.save();X.beginPath();X.rect(c,MY,MX+MW-c,MH);X.clip();X.drawImage(photo,MX,MY,MW,MH);X.restore();
    X.fillStyle=css(LAYERS[0]);X.fillRect(c-1.5,MY,3,MH)}
}};

function sceneFor(n){return [S.foto,S.ton,S.stege,S.laser,S.spray,S.spray,S.spray,S.spray,S.ende][n]}
function go(n){
  step=n;t=0;scene=sceneFor(n);
  if(n<4)rebuild(0);
  if(STEPS[n].k!==undefined){
    for(let k=STEPS[n].k+1;k<4;k++)sprayed[k]=null;
    scene.enter(STEPS[n].k);
  }else if(scene.enter)scene.enter();
  if(n===8)rebuild(4);
  document.querySelectorAll('#schritte li').forEach((l,i)=>{l.classList.toggle('an',i===n);
    l.querySelector('button').setAttribute('aria-current',i===n?'step':'false')});
  const a=document.querySelectorAll('#schritte li')[n];a.scrollIntoView({block:'nearest'});
  stage.classList.toggle('spruehen',STEPS[n].k!==undefined&&self);
  showValues();
}
function showValues(){
  const v=$('werte'),s=STEPS[step],k=s.k;
  if(step===8){if(!$('vergleich'))v.innerHTML='<label>Vergleich mit dem Foto<input type="range" id="vergleich" min="0" max="100" value="100"></label>';return}
  if(k===undefined){v.textContent='';return}
  const l=LAYERS[k],c=scene===S.spray?scene:{};
  const text=`${l.ral}, ${l.open} % Öffnung, ${l.stege} ${l.stege===1?'Steg':'Stege'}`;
  if(self&&c.phase==='sprühen'){
    if(!$('deckung')){
      v.innerHTML='Über die Platte ziehen. Deckung <span id="deckung"></span> % <button class="knopf" id="abnehmen">Platte abnehmen</button>';
      $('abnehmen').onclick=()=>scene.finish();
    }
    $('deckung').textContent=c.cover;
  }else v.textContent=c.phase==='trocknen'?'5 min antrocknen lassen':text;
}
let lastT=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const live=playing||(self&&scene===S.spray);
  if(live){
    t+=dt;
    const over=scene.tick?scene.tick(dt):t>scene.dur;
    if(over&&playing){if(step<8)go(step+1);else setPlay(false)}
  }
  scene.draw();requestAnimationFrame(frame);
}
function setPlay(p){playing=p;$('play').textContent=p?'Pause':'Abspielen'}

// ---- Bedienung ----
function pos(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
let down=false;
const canSpray=()=>self&&scene===S.spray&&scene.phase==='sprühen';
stage.addEventListener('pointerdown',e=>{if(!canSpray())return;down=true;stage.setPointerCapture(e.pointerId);scene.can=pos(e);scene.stamp(...scene.can)});
stage.addEventListener('pointermove',e=>{if(!canSpray())return;const p=pos(e);if(down)scene.line(scene.can,p);scene.can=p});
stage.addEventListener('pointerup',()=>down=false);
$('play').onclick=()=>{if(step===8&&!playing){reset();return}setPlay(!playing)};
function reset(){sprayed.fill(null);$('werte').textContent='';setPlay(true);go(0)}
$('neu').onclick=reset;
$('selbst').onchange=e=>{self=e.target.checked;stage.classList.toggle('spruehen',STEPS[step].k!==undefined&&self);showValues()};
addEventListener('keydown',e=>{
  if(e.target.closest('input,button')&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();$('play').click()}
  if(e.key==='ArrowRight'&&step<8)go(step+1);
  if(e.key==='ArrowLeft'&&step>0)go(step-1);
});

(async()=>{
  const b=(s,m)=>`data:${m};base64,${s}`;
  const ms=await Promise.all(DATA.masks.map(s=>load(b(s,'image/png'))));
  [photo,gray]=await Promise.all([load(b(DATA.photo,'image/jpeg')),load(b(DATA.gray,'image/jpeg'))]);
  [raw2,isl2,br2]=(await Promise.all([DATA.raw2,DATA.isl2,DATA.br2].map(s=>load(b(s,'image/png'))))).map(alphaMask);
  masks=ms.map(alphaMask);rings=DATA.rings;
  paper=makePaper();
  solid=LAYERS.map((l,k)=>maskFilled(masks[k],css(l)));
  plates=LAYERS.map((l,k)=>{
    const c=mk(),x=c.getContext('2d');x.drawImage(blankPlate(k),0,0);
    x.globalCompositeOperation='destination-out';x.drawImage(masks[k],MX,MY);
    x.globalCompositeOperation='source-over';x.strokeStyle='rgba(22,24,28,.8)';x.lineWidth=1.5;for(const r of rings[k])x.stroke(ringPath(r));
    return c});
  $('schritte').innerHTML=STEPS.map((s,i)=>{
    const n=s.k!==undefined?s.k+1:0;
    const mark=n?`<span class="platte" style="--c:${css(LAYERS[s.k])};--n:${s.k<2?'#16181c':'#f6f1e8'}">${'<i></i>'.repeat(n)}</span>`:`<span class="nr">${i+1}</span>`;
    return `<li><button>${mark}<span>${s.t}</span></button><p>${s.p}</p></li>`}).join('');
  document.querySelectorAll('#schritte button').forEach((c,i)=>c.onclick=()=>{if(i===8)$('werte').textContent='';go(i)});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)setPlay(false);
  go(0);requestAnimationFrame(n=>{lastT=n;frame(n)});
})();
</script>
</body>
</html>
