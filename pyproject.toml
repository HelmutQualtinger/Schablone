[project]
name = "schablone"
version = "0.1.0"
description = "Foto -> vier Sprayschablonen, Simulation, STL und Vierfarbbild"
readme = "README.md"
requires-python = ">=3.12"
# Laufzeit der Webseite. OpenCV fehlt hier absichtlich: der Container baut es selbst,
# lokal kommt es aus der Gruppe "lokal".
dependencies = [
    "flask>=3.1,<3.2",
    "gunicorn>=23,<24",
    "numpy>=2.2,<3",
    "shapely>=2.1,<3",
]

[dependency-groups]
# Lokal ohne Container: OpenCV als Wheel
lokal = ["opencv-python-headless>=4.10,<5"]
# Schablonensätze für Maria, Carl und BB (src/export.py): PDF-Zeichnung
export = ["reportlab>=4"]

[tool.uv]
package = false
default-groups = ["lokal"]
